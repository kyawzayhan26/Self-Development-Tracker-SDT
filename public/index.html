<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SDT - Self Development Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/styles.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
      <div>
        <h1 class="h3 mb-1">SDT</h1>
        <div class="text-secondary">Self Development Tracker (local)</div>
      </div>

      <div class="d-flex align-items-center gap-2">
        <button id="prevMonth" class="btn btn-outline-secondary btn-sm">‹</button>
        <div class="fw-semibold" id="monthLabel">—</div>
        <button id="nextMonth" class="btn btn-outline-secondary btn-sm">›</button>
        <button id="todayBtn" class="btn btn-primary btn-sm">Today</button>
      </div>
    </div>

    <!-- OVERALL PROGRESS (GIANT BAR) -->
    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-2">
          <div>
            <div class="text-secondary small">Overall challenge progress</div>
            <div class="h5 mb-0" id="overallText">—</div>
          </div>
          <div class="text-secondary small" id="overallMeta">—</div>
        </div>

        <div class="progress sdt-progress">
          <div
            id="overallBar"
            class="progress-bar"
            role="progressbar"
            style="width: 0%"
            aria-valuemin="0"
            aria-valuemax="100"
          ></div>
        </div>
      </div>
    </div>

    <!-- 📅 CALENDAR (NOW ABOVE STRIKES) -->
    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <div class="calendar-grid" id="calendarGrid"></div>
      </div>
    </div>

    <!-- ⚠️ STRIKES OVERVIEW (NOW BELOW CALENDAR) -->
    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-2">
          <div>
            <div class="text-secondary small">Strikes per rule</div>
            <div class="h6 mb-0" id="strikesMeta">—</div>
          </div>
          <div class="text-secondary small">
            Each miss = 1 strike (only recorded days count)
          </div>
        </div>

        <div id="strikesList" class="vstack gap-2"></div>
      </div>
    </div>

    <div class="mt-3 text-secondary small">
      Click a day to open the checklist and save progress.
    </div>
  </div>

  <!-- Day Details Modal -->
  <div class="modal fade" id="dayModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <div>
            <h5 class="modal-title mb-0">Day details</h5>
            <div class="text-secondary small" id="dayModalDate">—</div>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <div id="tasksList" class="vstack gap-2"></div>
          <div class="alert alert-info mt-3 mb-0 small">
            Your daily SDT rules are listed here. Tick them as you complete them, then hit Save.
          </div>
        </div>

        <div class="modal-footer">
          <div class="me-auto small text-secondary" id="saveStatus"></div>
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" id="saveBtn" class="btn btn-primary">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
